[tool.poetry]
name = "openbb-longbridge"
version = "1.0.0"
description = "LongBridge/LongPort data provider for OpenBB"
authors = ["OpenBB Team <hello@openbb.co>"]
license = "AGPL-3.0-only"
readme = "README.md"
packages = [{ include = "openbb_longbridge" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
longport = ">=2.0.0"
openbb-core = "^1.5.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."openbb_provider_extension"]
longbridge = "openbb_longbridge:longbridge_provider"
